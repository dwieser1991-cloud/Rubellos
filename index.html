<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Love Scratch Cards 💋</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="hearts" id="hearts" aria-hidden="true"></div>
    <main>
        <div class="wrap">
            <h1>Love Scratch Cards 💋</h1>
            <p>Six cards, three scratches. Choose wisely, my love… every card hides a little surprise from me.</p>
            <p id="left">3 scratches left</p>
            <div class="board" id="board"></div>
            <div id="res">
                <h1 style="font-size:2rem">Your prizes 🎁</h1>
                <div class="sum" id="sum"></div>
                <p>Send them to me, so I can make every wish come true 😘</p>
                <div id="links"></div>
                <button class="ghost" id="cp">📋 Copy prizes</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
